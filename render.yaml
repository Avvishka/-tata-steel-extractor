services:
  - type: web
    name: tata-steel-extractor-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr poppler-utils libgl1 && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
